<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jolgue AI</title>
<style>
:root{--bg:#fff;--surface:#f7f7f8;--surface2:#fff;--text:#171717;--muted:#777;--border:#e5e5e5;--hover:#ececec;--user:#f4f4f4}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
.app{height:100%;display:flex}.sidebar{width:260px;flex:0 0 260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30}.side-head{padding:10px}.brandrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.brand{font-size:15px;font-weight:700;padding:8px 9px}.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#666}.icon:hover{background:var(--hover)}.new{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:9px;text-align:left;font-weight:600}.new:hover{background:var(--hover)}.new b{font-size:20px;font-weight:400}.search{position:relative;margin:5px 0}.search svg{position:absolute;left:10px;top:10px;color:#777}.search input{width:100%;padding:9px 10px 9px 33px;border:0;outline:0;border-radius:8px;background:transparent;color:var(--text)}.search input:hover,.search input:focus{background:var(--hover)}.scroll{flex:1;overflow:auto;padding:0 8px}.label{font-size:11px;font-weight:650;color:#909090;text-transform:uppercase;padding:11px 10px 6px}.chat{display:flex;align-items:center;gap:5px;width:100%;padding:9px 10px;border-radius:8px;text-align:left}.chat:hover,.chat.active{background:var(--hover)}.chatname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatdel{opacity:0;color:#777}.chat:hover .chatdel{opacity:1}.file{padding:6px 10px;border-radius:7px;color:#666;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file:hover{background:var(--hover)}.empty{padding:7px 10px;color:var(--muted);font-size:12px}.sidefoot{border-top:1px solid var(--border);padding:9px}.account{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px}.account:hover{background:var(--hover)}.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#111;color:white;font-size:11px;font-weight:700}.accounttext{flex:1}.accountname{font-weight:650;font-size:13px}.accountsub{font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.topl,.topr{display:flex;align-items:center;gap:5px}.mobile{display:none}.model{padding:8px 10px;border-radius:9px;font-size:15px;font-weight:650}.model:hover{background:var(--surface)}.model span:last-child{font-size:12px;color:#777}.status{font-size:11px;color:var(--muted);padding:0 6px}.layout{flex:1;min-height:0;display:flex}.chatarea{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:15px 0 28px}.row{display:flex;justify-content:center}.inner{width:min(820px,calc(100% - 34px));display:flex;gap:14px;padding:18px 0}.row.user .inner{justify-content:flex-end}.msgavatar{width:30px;height:30px;flex:0 0 30px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700}.ai{background:#000;color:#fff}.me{background:#ddd;color:#222}.copy{flex:1;min-width:0}.meta{font-size:12px;font-weight:650;margin:3px 0 6px}.bubble{font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word}.row.user .bubble{background:var(--user);padding:10px 15px;border-radius:18px;max-width:78%}.actions{display:flex;gap:2px;margin-top:7px;opacity:0}.inner:hover .actions{opacity:1}.actions button{padding:4px 7px;border-radius:6px;color:#777;font-size:12px}.actions button:hover{background:var(--surface);color:#222}.code{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:12px 0;background:#f7f7f7}.codehead{display:flex;justify-content:space-between;padding:6px 10px;background:#ececec;color:#666;font-size:11px}.code pre{margin:0;padding:12px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.inline{font:12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#ececec;padding:2px 5px;border-radius:5px}.welcome{height:100%;display:flex;align-items:center;justify-content:center;padding:40px 20px}.welcomein{width:min(760px,100%);margin-top:-7vh}.mark{width:38px;height:38px;border-radius:10px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 20px}.welcome h1{text-align:center;font-size:29px;font-weight:600;letter-spacing:-.02em;margin:0 0 28px}.suggest{display:grid;grid-template-columns:1fr 1fr;gap:9px}.suggest button{border:1px solid var(--border);border-radius:13px;padding:13px 14px;text-align:left;background:var(--surface2)}.suggest button:hover{background:var(--surface)}.suggest b{display:block;font-size:13px;margin-bottom:2px}.suggest span{color:var(--muted);font-size:12px}
.composerwrap{padding:5px 16px 17px;background:linear-gradient(to top,var(--bg) 75%,transparent)}.composer{width:min(820px,100%);margin:auto}.box{background:var(--surface2);border:1px solid #c9c9cf;border-radius:23px;padding:10px 12px 9px;box-shadow:0 2px 9px rgba(0,0,0,.05)}.box:focus-within{border-color:#aaa;box-shadow:0 2px 13px rgba(0,0,0,.08)}#input{width:100%;min-height:27px;max-height:190px;resize:none;border:0;outline:0;background:transparent;padding:3px 4px 9px;color:var(--text);font-size:15px;line-height:1.45}.tools{display:flex;justify-content:space-between;align-items:center}.lefttools{display:flex;gap:2px}.tool{height:33px;min-width:33px;border-radius:9px;display:grid;place-items:center;color:#666}.tool:hover{background:var(--surface)}.send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#000;color:#fff}.send:disabled{background:#d6d6d8;color:#fff;cursor:default}.hint{text-align:center;color:#8d8d91;font-size:10px;padding-top:7px}
.panel{width:340px;flex:0 0 340px;border-left:1px solid var(--border);background:var(--surface);padding:17px;overflow:auto}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ptitle{font-size:14px;font-weight:650}.card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px}.ctitle{font-size:13px;font-weight:650;margin-bottom:9px}.field{display:block;width:100%;margin:5px 0;padding:9px 10px;border:1px solid #d3d3d7;border-radius:8px;outline:0;background:var(--surface2);color:var(--text)}.field:focus{border-color:#aaa}.save{width:100%;padding:9px;border-radius:8px;background:#111;color:white;font-weight:650;margin-top:4px}.plist{max-height:300px;overflow:auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:9px;background:#111;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.15s;z-index:100}.toast.show{opacity:1}.overlay{display:none}
@media(prefers-color-scheme:dark){:root{--bg:#212121;--surface:#171717;--surface2:#212121;--text:#ececec;--muted:#a5a5a5;--border:#3d3d3d;--hover:#2b2b2b;--user:#2f2f2f}.me{background:#555;color:#eee}.suggest button,.box,.card{box-shadow:none}.code{background:#181818}.codehead{background:#2b2b2b}.inline{background:#303030}.field{border-color:#454545}.file{color:#aaa}}
@media(max-width:1050px){.panel{display:none}.panel.open{display:block;position:fixed;right:0;top:0;bottom:0;z-index:25;box-shadow:-12px 0 30px rgba(0,0,0,.14)}}
@media(max-width:700px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .18s;box-shadow:12px 0 30px rgba(0,0,0,.14)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:20}.mobile{display:grid}.top{height:54px;padding:0 8px}.status{display:none}.inner{width:calc(100% - 20px);gap:9px;padding:15px 0}.row.user .bubble{max-width:88%}.actions{opacity:1}.welcome h1{font-size:26px}.suggest{grid-template-columns:1fr}.composerwrap{padding:5px 8px 10px}.box{border-radius:20px}.panel.open{width:92%}}
</style>
</head>
<body>
<div class="app"><div id="overlay" class="overlay" onclick="toggleSidebar(false)"></div>
<aside id="sidebar" class="sidebar"><div class="side-head"><div class="brandrow"><div class="brand">Jolgue AI</div><button class="icon" onclick="toggleSidebar(false)">×</button></div><button class="new" onclick="newChat()"><b>＋</b><span>New chat</span></button><div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg><input id="search" placeholder="Search chats" oninput="renderChats()"></div></div><div class="scroll"><div class="label">Chats</div><div id="chats"></div><div class="label">Workspace</div><div id="files"></div></div><div class="sidefoot"><div class="account"><div class="avatar">J</div><div class="accounttext"><div class="accountname">Jolgue AI</div><div class="accountsub">Workspace enabled</div></div><button class="icon" onclick="togglePanel()">⚙</button></div></div></aside>
<main class="main"><header class="top"><div class="topl"><button class="icon mobile" onclick="toggleSidebar(true)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="model"><span id="modelName">Jolgue AI</span><span>⌄</span></button></div><div class="topr"><span id="status" class="status">Ready</span><button class="icon" onclick="newChat()" title="New chat">＋</button><button class="icon" onclick="togglePanel()" title="Settings">⚙</button></div></header>
<div class="layout"><section class="chatarea"><div id="messages" class="messages"></div><div class="composerwrap"><div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="Message Jolgue AI..."></textarea><div class="tools"><div class="lefttools"><button class="tool" title="Attach">＋</button><button class="tool" onclick="showToast('Workspace tools are available automatically')" title="Tools">☷</button></div><button id="send" class="send" onclick="handleSend()" disabled title="Send"><svg id="sendicon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg></button></div></div><div class="hint">Jolgue AI can make mistakes. Check important information.</div></div></div></section>
<aside id="panel" class="panel"><div class="panelhead"><div class="ptitle">Settings & workspace</div><button class="icon" onclick="togglePanel(false)">×</button></div><div class="card"><div class="ctitle">Provider</div><input id="base" class="field" placeholder="Base URL"><input id="model" class="field" placeholder="Model"><input id="key" class="field" type="password" placeholder="API key"><button class="save" onclick="saveProvider()">Save</button></div><div class="card"><div class="ctitle">Workspace files</div><div id="panelFiles" class="plist"></div></div></aside></div></main></div><div id="toast" class="toast"></div>
<script>
const S={data:null,chat:null,busy:false,job:null,panel:false};
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch(_){}if(!r.ok&&r.status!==499)throw new Error(d.error||`HTTP ${r.status}`);return d}
function esc(s=''){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function md(s=''){let out='',last=0,re=/```([\w+-]*)\n?([\s\S]*?)```/g,m;while((m=re.exec(s))){out+=inline(esc(s.slice(last,m.index)));out+=`<div class="code"><div class="codehead"><span>${esc(m[1]||'code')}</span><button onclick="copyText(${JSON.stringify(m[2])})">Copy</button></div><pre>${esc(m[2])}</pre></div>`;last=m.index+m[0].length}out+=inline(esc(s.slice(last)));return out.replace(/\n/g,'<br>')}
function inline(s){return s.replace(/`([^`]+)`/g,'<span class="inline">$1</span>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function render(){renderChats();const box=document.getElementById('messages');if(!S.chat||!S.chat.messages?.length){box.innerHTML=`<div class="welcome"><div class="welcomein"><div class="mark">J</div><h1>What can I help you with?</h1><div class="suggest"><button onclick="usePrompt('Create a Python project with a main.py file')"><b>Create a project</b><span>Build files directly in the workspace.</span></button><button onclick="usePrompt('Review this code and suggest improvements')"><b>Improve code</b><span>Review and clean up your code.</span></button><button onclick="usePrompt('Create a ZIP archive of the workspace')"><b>Manage files</b><span>Zip, unzip, move and edit files.</span></button><button onclick="usePrompt('Give me three useful ideas for this project')"><b>Brainstorm</b><span>Think through the next step.</span></button></div></div></div>`;return}box.innerHTML=S.chat.messages.map((m,i)=>{const user=m.role==='user';return `<div class="row ${user?'user':''}"><div class="inner"><div class="msgavatar ${user?'me':'ai'}">${user?'U':'J'}</div><div class="copy"><div class="meta">${user?'You':'Jolgue AI'}</div><div class="bubble">${user?esc(m.content):md(m.content)}</div>${!user?`<div class="actions"><button onclick="copyText(${JSON.stringify(m.content)})">Copy</button><button onclick="regenerate(${i})">Regenerate</button></div>`:''}</div></div></div>`}).join('');requestAnimationFrame(()=>box.scrollTop=box.scrollHeight)}
function renderChats(){const q=(document.getElementById('search')?.value||'').toLowerCase();const cs=(S.data?.chats||[]).filter(c=>(c.title||'New chat').toLowerCase().includes(q));document.getElementById('chats').innerHTML=cs.map(c=>`<div class="chat ${S.chat?.id===c.id?'active':''}" onclick="pickChat('${c.id}')"><span class="chatname">${esc(c.title||'New chat')}</span><button class="chatdel" onclick="event.stopPropagation();deleteChat('${c.id}')">×</button></div>`).join('')||'<div class="empty">No chats yet.</div>'}
function renderFiles(files){const html=(files||[]).map(f=>`<div class="file" title="${esc(f.path)}">${esc(f.path)}</div>`).join('')||'<div class="empty">No workspace files.</div>';document.getElementById('files').innerHTML=html;document.getElementById('panelFiles').innerHTML=html}
async function load(){S.data=await api('/api/state');S.chat=S.data.chats?.[0]||null;document.getElementById('base').value=S.data.provider?.base_url||'';document.getElementById('model').value=S.data.provider?.model||'';document.getElementById('modelName').textContent=S.data.provider?.model||'Jolgue AI';render();refreshFiles()}
async function refreshFiles(){const r=await api('/api/files');renderFiles(r.files)}
function pickChat(id){S.chat=S.data.chats.find(c=>c.id===id);toggleSidebar(false);render()}
async function newChat(){const c={id:crypto.randomUUID(),title:'New chat',messages:[]};S.data.chats.unshift(c);S.chat=c;await save();toggleSidebar(false);render();document.getElementById('input').focus()}
async function deleteChat(id){S.data.chats=S.data.chats.filter(c=>c.id!==id);if(S.chat?.id===id)S.chat=S.data.chats[0]||null;await save();render()}
async function save(){await api('/api/state','POST',S.data)}
function setBusy(v){S.busy=v;const b=document.getElementById('send'),ic=document.getElementById('sendicon');b.disabled=!v&&!document.getElementById('input').value.trim();ic.innerHTML=v?'<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>':'<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>';b.title=v?'Stop':'Send';}
async function handleSend(){if(S.busy){await stop();return}await send()}
async function send(){const i=document.getElementById('input'),text=i.value.trim();if(!text||S.busy)return;if(!S.chat)await newChat();i.value='';resize();S.chat.messages.push({role:'user',content:text});if(S.chat.title==='New chat')S.chat.title=text.slice(0,48)||'New chat';await save();render();setBusy(true);document.getElementById('status').textContent='Thinking…';const job=crypto.randomUUID();S.job=job;try{const r=await api('/api/chat','POST',{job_id:job,messages:S.chat.messages,provider:S.data.provider,skills:S.data.skills});if(r.stopped){showToast('Generation stopped');return}if(r.error){S.chat.messages.push({role:'assistant',content:r.error});}else{S.chat.messages.push({role:'assistant',content:r.content||'No response.'});renderFiles(r.files);await save();render()}}catch(e){S.chat.messages.push({role:'assistant',content:'Error: '+e.message});await save();render()}finally{S.job=null;setBusy(false);document.getElementById('status').textContent='Ready'}}
async function stop(){if(!S.job)return;document.getElementById('status').textContent='Stopping…';try{await api('/api/chat/stop','POST',{job_id:S.job})}catch(_){}S.busy=false;setBusy(false);document.getElementById('status').textContent='Ready';showToast('Generation stopped')}
async function regenerate(i){if(S.busy||!S.chat)return;const last=S.chat.messages.slice(0,i).filter(x=>x.role==='user').pop();if(!last)return;S.chat.messages=S.chat.messages.slice(0,i-1);document.getElementById('input').value=last.content;resize();await send()}
function usePrompt(t){document.getElementById('input').value=t;resize();document.getElementById('input').focus()}
function copyText(t){navigator.clipboard?.writeText(String(t));showToast('Copied')}
function saveProvider(){S.data.provider.base_url=document.getElementById('base').value.trim();S.data.provider.model=document.getElementById('model').value.trim();S.data.provider.api_key=document.getElementById('key').value.trim();document.getElementById('modelName').textContent=S.data.provider.model||'Jolgue AI';save();showToast('Provider saved')}
function togglePanel(force){S.panel=force===undefined?!S.panel:force;document.getElementById('panel').classList.toggle('open',S.panel)}
function toggleSidebar(force){const o=force===undefined?!document.getElementById('sidebar').classList.contains('open'):force;document.getElementById('sidebar').classList.toggle('open',o);document.getElementById('overlay').classList.toggle('show',o)}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}
function resize(){const t=document.getElementById('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,190)+'px';setBusy(S.busy)}
document.getElementById('input').addEventListener('input',resize);document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});load();
</script></body></html>
