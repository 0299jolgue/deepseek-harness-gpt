<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jolgue AI</title>
<style>
:root{--bg:#fff;--panel:#f7f7f8;--text:#171717;--muted:#777;--line:#e5e5e7;--hover:#ececee;--user:#f1f1f2}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.app{height:100%;display:flex}.sidebar{width:260px;flex:0 0 260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.side-top{padding:12px}.brand{font-weight:700;padding:8px}.newchat{width:100%;padding:10px;text-align:left;border-radius:9px;font-weight:650}.newchat:hover,.chat:hover,.chat.active,.icon:hover{background:var(--hover)}.search{margin:7px 0}.search input{width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--text);outline:0}.scroll{flex:1;overflow:auto;padding:0 8px}.label{font-size:11px;color:#888;text-transform:uppercase;font-weight:700;padding:11px 10px 6px}.chat{display:flex;gap:7px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;text-align:left}.chatname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatdel{opacity:0}.chat:hover .chatdel{opacity:1}.file{display:flex;gap:7px;padding:6px 8px;color:#666;font-size:12px}.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sidefoot{border-top:1px solid var(--line);padding:9px}.account{display:flex;gap:9px;align-items:center;padding:8px}.avatar,.ai,.me{width:30px;height:30px;border-radius:8px;background:#111;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}.accounttext{flex:1}.accountname{font-weight:650}.accountsub{font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.top-left,.top-right{display:flex;align-items:center;gap:5px}.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#666}.model{padding:8px 10px;border-radius:9px;font-size:15px;font-weight:650}.status{font-size:11px;color:var(--muted)}.layout{flex:1;min-height:0;display:flex}.chat-area{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:12px 0 28px}.welcome{height:100%;display:grid;place-items:center}.welcomein{text-align:center;width:min(760px,calc(100% - 30px));margin-top:-7vh}.logo{width:40px;height:40px;border-radius:11px;background:#000;color:#fff;display:grid;place-items:center;font-weight:800;margin:auto}.welcome h1{font-size:28px;font-weight:600;margin:18px 0 24px}.suggest{display:grid;grid-template-columns:1fr 1fr;gap:9px}.suggest button{padding:13px;text-align:left;border:1px solid var(--line);border-radius:13px}.suggest button:hover{background:var(--panel)}.suggest b{display:block}.suggest span{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:center}.inner{width:min(820px,calc(100% - 34px));display:flex;gap:14px;padding:17px 0}.row.user .inner{justify-content:flex-end}.copy{flex:1;min-width:0}.meta{font-size:12px;font-weight:650;margin:3px 0 6px}.bubble{font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word}.row.user .bubble{background:var(--user);padding:10px 15px;border-radius:18px;max-width:78%}.tool-result{margin-top:9px;padding:9px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:12px;color:#555;white-space:pre-wrap}.download-card{display:inline-flex;align-items:center;gap:8px;margin-top:9px;padding:9px 12px;border:1px solid #cfcfd3;border-radius:10px;text-decoration:none;color:var(--text);font-weight:650;background:var(--bg)}.download-card:hover{background:var(--hover)}.composerwrap{padding:4px 16px 17px}.composer{width:min(820px,100%);margin:auto}.box{border:1px solid #c9c9cf;border-radius:23px;padding:10px 12px 9px}.input{width:100%;min-height:27px;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:3px 4px 9px;font-size:15px}.tools{display:flex;justify-content:space-between}.send{width:34px;height:34px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center}.send.stop{background:#555}.send:disabled{background:#d6d6d8;cursor:default}.hint{text-align:center;color:#999;font-size:10px;padding-top:7px}.panel{width:340px;flex:0 0 340px;border-left:1px solid var(--line);background:var(--panel);padding:17px;overflow:auto}.panelhead{display:flex;justify-content:space-between;align-items:center}.ptitle{font-weight:650}.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0}.ctitle{font-weight:650;margin-bottom:8px}.field{display:block;width:100%;padding:9px 10px;margin:6px 0;border:1px solid #d3d3d7;border-radius:8px;outline:0;background:var(--bg);color:var(--text)}.save,.searchbtn{padding:9px 11px;border-radius:8px;background:#111;color:#fff;font-weight:650}.save{width:100%}.terminal{background:#101010;color:#eee;border-radius:9px;padding:9px;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:230px;overflow:auto}.searchbox{display:flex;gap:6px}.searchbox .field{margin:0}.searchlist{margin-top:8px}.result{display:block;padding:8px;border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none;margin-top:6px}.result small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-file{font-size:11px;padding:6px 0;border-bottom:1px solid var(--line);word-break:break-all}.panel-download{margin-left:8px;font-size:11px;text-decoration:underline}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:9px;opacity:0;pointer-events:none;transition:.15s}.toast.show{opacity:1}@media(max-width:1050px){.panel{display:none}.panel.open{display:block;position:fixed;top:0;right:0;bottom:0;z-index:20}}@media(max-width:700px){.sidebar{display:none}.sidebar.open{display:flex;position:fixed;left:0;top:0;bottom:0;z-index:30;box-shadow:10px 0 25px rgba(0,0,0,.15)}.inner{width:calc(100% - 20px)}.row.user .bubble{max-width:88%}.suggest{grid-template-columns:1fr}.composerwrap{padding:4px 8px 10px}}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar" class="sidebar"><div class="side-top"><div class="brand">Jolgue AI</div><button class="newchat" onclick="newChat()">＋ New chat</button><div class="search"><input id="chatSearch" placeholder="Search chats" oninput="renderChats()"></div></div><div class="scroll"><div class="label">Chats</div><div id="chats"></div><div class="label">Workspace</div><div id="files"></div></div><div class="sidefoot"><div class="account"><div class="avatar">J</div><div class="accounttext"><div class="accountname">Jolgue AI</div><div class="accountsub">Background agent enabled</div></div><button class="icon" onclick="togglePanel(true)">⚙</button></div></div></aside>
<main class="main"><header class="top"><div class="top-left"><button class="icon" onclick="toggleSidebar()">☰</button><button class="model">Jolgue AI ⌄</button></div><div class="top-right"><span id="status" class="status">Ready</span><button class="icon" onclick="newChat()">＋</button><button class="icon" onclick="togglePanel(true)">⚙</button></div></header>
<div class="layout"><section class="chat-area"><div id="messages" class="messages"></div><div class="composerwrap"><div class="composer"><div class="box"><textarea id="input" class="input" rows="1" placeholder="Message Jolgue AI..."></textarea><div class="tools"><span></span><button id="send" class="send" onclick="handleSend()" disabled>↑</button></div></div><div class="hint">O agente continua no servidor mesmo com esta página fechada.</div></div></div></section>
<aside id="panel" class="panel"><div class="panelhead"><div class="ptitle">Workspace & tools</div><button class="icon" onclick="togglePanel(false)">×</button></div><div class="card"><div class="ctitle">Provider</div><input id="base" class="field" placeholder="Base URL"><input id="model" class="field" placeholder="Model"><input id="key" class="field" type="password" placeholder="API key"><button class="save" onclick="saveProvider()">Save provider</button></div><div class="card"><div class="ctitle">Web search</div><div class="searchbox"><input id="webq" class="field" placeholder="Pesquisar na web..."><button class="searchbtn" onclick="manualSearch()">Search</button></div><div id="searchlist" class="searchlist"></div></div><div class="card"><div class="ctitle">Shell</div><input id="shellq" class="field" placeholder="python --version"><button class="searchbtn" style="width:100%" onclick="runShell()">Run command</button><pre id="shellout" class="terminal" style="display:none;margin-top:8px"></pre></div><div class="card"><div class="ctitle">Workspace files</div><div id="panelFiles"></div></div></aside></div></main></div><div id="toast" class="toast"></div>
<script>
const S={data:null,chat:null,busy:false,job:null,poll:null};
const LS='jolgue_active_chat_v3';
async function api(path,method='GET',body){const opt={method,headers:{'content-type':'application/json'}};if(body!==undefined)opt.body=JSON.stringify(body);const r=await fetch(path,opt);const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text||'Request failed'}}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({chat:S.chat,job:S.job}))}catch{}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch{return null}}
function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function newChat(){if(S.busy)return;S.chat={id:crypto.randomUUID(),title:'New chat',messages:[]};S.job=null;saveLocal();render();document.getElementById('input').focus()}
function renderChats(){const box=document.getElementById('chats');const q=(document.getElementById('chatSearch').value||'').toLowerCase();box.innerHTML='';for(const c of (S.data?.chats||[]).slice().reverse()){if(q&&!JSON.stringify(c).toLowerCase().includes(q))continue;const b=document.createElement('button');b.className='chat '+(S.chat?.id===c.id?'active':'');b.innerHTML='<span class="chatname"></span><span class="chatdel">×</span>';b.querySelector('.chatname').textContent=c.title||'Chat';b.onclick=()=>{S.chat=c;S.job=null;saveLocal();render()};b.querySelector('.chatdel').onclick=e=>{e.stopPropagation();deleteChat(c.id)};box.appendChild(b)}}
async function deleteChat(id){S.data.chats=(S.data.chats||[]).filter(c=>c.id!==id);await api('/api/state','POST',S.data);if(S.chat?.id===id)newChat();renderChats()}
async function persist(){if(!S.data||!S.chat)return;const ix=(S.data.chats||[]).findIndex(c=>c.id===S.chat.id);if(ix>=0)S.data.chats[ix]=S.chat;else{S.data.chats=S.data.chats||[];S.data.chats.push(S.chat)}try{await api('/api/state','POST',S.data)}catch(e){console.error(e)}saveLocal();renderChats()}
function renderText(t){return String(t||'').replace(/<tool>[\\s\\S]*?<\\/tool>/g,'').replace(/```([\\s\\S]*?)```/g,(_,x)=>`\\n[code]\\n${x.trim()}\\n[/code]\\n`)}
function addDownloadCards(copy,tools){for(const x of (tools||[])){if(!x.download_url)continue;const a=document.createElement('a');a.className='download-card';a.href=x.download_url;a.setAttribute('download','');a.textContent='⬇️ Baixar '+(x.path||'ficheiro');copy.appendChild(a)}}
function render(){const el=document.getElementById('messages');if(!S.chat||!S.chat.messages.length){el.innerHTML='<div class="welcome"><div class="welcomein"><div class="logo">J</div><h1>How can I help?</h1><div class="suggest"><button onclick="suggest(\'Build something in my workspace and test it\')"><b>Build</b><span>Create and test files with the agent.</span></button><button onclick="suggest(\'Search the web and give me the latest answer\')"><b>Research</b><span>Use live web search when needed.</span></button></div></div></div>';return}el.innerHTML='';for(const m of S.chat.messages){const row=document.createElement('div');row.className='row '+(m.role==='user'?'user':'assistant');const inn=document.createElement('div');inn.className='inner';const av=document.createElement('div');av.className='msgavatar '+(m.role==='user'?'me':'ai');av.textContent=m.role==='user'?'U':'J';const copy=document.createElement('div');copy.className='copy';const meta=document.createElement('div');meta.className='meta';meta.textContent=m.role==='user'?'You':'Jolgue AI';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=renderText(m.content);copy.append(meta,bubble);if(m.tools?.length){const t=document.createElement('div');t.className='tool-result';t.textContent=m.tools.map(x=>`${x.tool}: ${x.ok?'ok':'error'}${x.error?' — '+x.error:''}`).join('\n');copy.appendChild(t);addDownloadCards(copy,m.tools)}if(m.status){const t=document.createElement('div');t.className='tool-result';t.textContent=m.status;copy.appendChild(t)}inn.append(av,copy);row.appendChild(inn);el.appendChild(row)}el.scrollTop=el.scrollHeight}
function suggest(t){document.getElementById('input').value=t;updateSend();handleSend()}
function updateSend(){document.getElementById('send').disabled=!document.getElementById('input').value.trim()&&!S.busy}
function setStatus(t){document.getElementById('status').textContent=t}
async function stopJob(){if(!S.job)return;try{await api('/api/jobs/stop','POST',{job_id:S.job});setStatus('Stopping…')}catch(e){showToast(e.message)}}
async function handleSend(){if(S.busy){await stopJob();return}const input=document.getElementById('input');const text=input.value.trim();if(!text)return;if(!S.chat)S.chat={id:crypto.randomUUID(),title:text.slice(0,42),messages:[]};if(!S.chat.title||S.chat.title==='New chat')S.chat.title=text.slice(0,42);S.chat.messages.push({role:'user',content:text});input.value='';S.busy=true;setStatus('Starting agent…');render();await persist();try{const provider=S.data.provider||{};const search=S.data.search||{};const r=await api('/api/chat','POST',{job_id:crypto.randomUUID(),chat_id:S.chat.id,provider,search,skills:S.data.skills||[],messages:S.chat.messages});S.job=r.job_id;saveLocal();setStatus('Agent working…');beginPoll()}catch(e){S.busy=false;setStatus('Error');S.chat.messages.push({role:'assistant',content:'Error: '+e.message});await persist();render()}updateSend()}
function beginPoll(){if(S.poll)clearInterval(S.poll);pollJob();S.poll=setInterval(pollJob,1200)}
async function pollJob(){if(!S.job)return;try{const j=await api('/api/jobs/'+encodeURIComponent(S.job));if(j.status==='running'){setStatus(`Agent working · step ${j.step||0}`);return}clearInterval(S.poll);S.poll=null;S.busy=false;if(j.status==='completed'){S.chat.messages.push({role:'assistant',content:j.content||'',tools:j.tools||[]});setStatus('Ready')}else if(j.cancelled||j.status==='stopped'){S.chat.messages.push({role:'assistant',content:j.content||'Generation stopped.'});setStatus('Stopped')}else{S.chat.messages.push({role:'assistant',content:'Error: '+(j.error||'Unknown error')});setStatus('Error')}S.job=null;await persist();refreshFiles();render();updateSend()}catch(e){setStatus('Reconnecting…')}}
async function recoverAgent(){const local=loadLocal();if(local?.chat)S.chat=local.chat;if(local?.job)S.job=local.job;if(!S.chat)S.chat={id:crypto.randomUUID(),title:'New chat',messages:[]};if(S.job){try{await api('/api/jobs/'+encodeURIComponent(S.job));S.busy=true;setStatus('Recovering agent…');beginPoll()}catch{S.job=null}}render()}
async function saveProvider(){S.data.provider={base_url:document.getElementById('base').value.trim(),model:document.getElementById('model').value.trim(),api_key:document.getElementById('key').value};await api('/api/state','POST',S.data);showToast('Provider saved')}
async function manualSearch(){const q=document.getElementById('webq').value.trim();if(!q)return;const cfg=S.data.search||{};try{const r=await api('/api/search','POST',{search:{query:q,provider:cfg.provider,api_key:cfg.api_key}});document.getElementById('searchlist').innerHTML=(r.results||[]).map(x=>`<a class="result" href="${x.url}" target="_blank" rel="noopener"><b>${escapeHtml(x.title)}</b><small>${escapeHtml(x.url)}</small></a>`).join('')}catch(e){showToast(e.message)}}
async function runShell(){const q=document.getElementById('shellq').value.trim();if(!q)return;const out=document.getElementById('shellout');out.style.display='block';out.textContent='Running…';try{const r=await api('/api/shell','POST',{command:q});out.textContent=(r.stdout||'')+(r.stderr?'\n'+r.stderr:'')}catch(e){out.textContent='Error: '+e.message}}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refreshFiles(){try{const r=await api('/api/files');const html=(r.files||[]).map(f=>{const ext=f.path.toLowerCase();const dl=ext.endsWith('.zip')?`<a class="panel-download" href="/download?path=${encodeURIComponent(f.path)}" download>Baixar</a>`:'';return `<div class="file"><span class="file-name">${escapeHtml(f.path)}</span>${dl}</div>`}).join('');document.getElementById('files').innerHTML=html;document.getElementById('panelFiles').innerHTML=(r.files||[]).map(f=>{const ext=f.path.toLowerCase();const dl=ext.endsWith('.zip')?`<a class="panel-download" href="/download?path=${encodeURIComponent(f.path)}" download>Baixar</a>`:'';return `<div class="panel-file">${escapeHtml(f.path)}${dl}</div>`}).join('')}catch{}}
function togglePanel(v){document.getElementById('panel').classList.toggle('open',v)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
(async function init(){try{S.data=await api('/api/state');document.getElementById('base').value=S.data.provider?.base_url||'';document.getElementById('model').value=S.data.provider?.model||'';renderChats();await refreshFiles();await recoverAgent();updateSend()}catch(e){showToast(e.message)}})();
document.getElementById('input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,190)+'px';updateSend()});document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});
</script>
</body>
</html>
