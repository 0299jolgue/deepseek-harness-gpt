<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jolgue AI</title>
<style>
:root{--bg:#fff;--panel:#f7f7f8;--text:#171717;--muted:#777;--line:#e6e6e7;--hover:#ececee;--user:#f4f4f4;--accent:#000}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.hidden{display:none!important}
.app{height:100%;display:flex}.sidebar{width:260px;flex:0 0 260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}.side-top{padding:11px}.brand{font-weight:700;font-size:15px;padding:8px 9px}.newchat{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:9px;font-weight:600;text-align:left}.newchat:hover,.chat:hover,.chat.active,.icon:hover{background:var(--hover)}.newchat b{font-size:20px;font-weight:400}.search{position:relative;margin:6px 0}.search svg{position:absolute;left:10px;top:10px;color:#777}.search input{width:100%;padding:9px 10px 9px 33px;border:0;border-radius:8px;outline:none;background:transparent;color:var(--text)}.search input:focus{background:var(--hover)}.scroll{flex:1;overflow:auto;padding:0 8px}.label{font-size:11px;color:#8b8b92;text-transform:uppercase;font-weight:650;padding:11px 10px 6px}.chat{width:100%;display:flex;align-items:center;padding:9px 10px;border-radius:8px;text-align:left}.chatname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatdel{opacity:0;color:#777}.chat:hover .chatdel{opacity:1}.file{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;color:#67676f;font-size:12px}.file:hover{background:var(--hover)}.file-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.download-mini{font-size:11px;color:#555;padding:3px 5px;border-radius:6px}.download-mini:hover{background:#ddd}.sidefoot{border-top:1px solid var(--line);padding:9px}.account{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px}.avatar{width:30px;height:30px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}.accounttext{flex:1}.accountname{font-weight:650;font-size:13px}.accountsub{font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.top-left,.top-right{display:flex;align-items:center;gap:4px}.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#666}.mobile{display:none}.model{padding:8px 10px;border-radius:9px;font-size:15px;font-weight:650}.model:hover{background:var(--panel)}.status{font-size:11px;color:var(--muted);padding:0 8px}
.layout{flex:1;min-height:0;display:flex}.chat-area{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:12px 0 28px}.welcome{height:100%;display:flex;align-items:center;justify-content:center;padding:30px 18px}.welcomein{width:min(760px,100%);margin-top:-8vh;text-align:center}.logo{width:38px;height:38px;border-radius:10px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 18px}.welcome h1{font-size:29px;font-weight:600;letter-spacing:-.02em;margin:0 0 24px}.suggest{display:grid;grid-template-columns:1fr 1fr;gap:9px}.suggest button{padding:13px 14px;border:1px solid var(--line);border-radius:13px;text-align:left}.suggest button:hover{background:var(--panel)}.suggest b{display:block;font-size:13px;margin-bottom:2px}.suggest span{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:center}.inner{width:min(820px,calc(100% - 34px));display:flex;gap:14px;padding:17px 0}.row.user .inner{justify-content:flex-end}.msgavatar{width:30px;height:30px;flex:0 0 30px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700}.ai{background:#000;color:#fff}.me{background:#ddd;color:#222}.copy{flex:1;min-width:0}.meta{font-size:12px;font-weight:650;margin:3px 0 6px}.bubble{font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word}.row.user .bubble{background:var(--user);padding:10px 15px;border-radius:18px;max-width:78%}.actions{display:flex;gap:2px;margin-top:7px}.actions button{padding:4px 7px;border-radius:6px;color:#777;font-size:12px}.actions button:hover{background:var(--panel);color:#222}.code{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:11px 0;background:#f7f7f7}.codehead{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#ececec;color:#666;font-size:11px}.codehead button{padding:3px 6px;border-radius:6px}.codehead button:hover{background:#d7d7d7}.code pre{margin:0;padding:12px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.tool-result{margin-top:10px;padding:9px 10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:12px;color:#555}.download-card{display:inline-flex;align-items:center;gap:8px;margin-top:7px;padding:8px 11px;border:1px solid #ccc;border-radius:9px;text-decoration:none;color:var(--text);background:var(--bg);font-weight:600}.download-card:hover{background:var(--hover)}.search-results{margin-top:9px;display:grid;gap:6px}.result{display:block;padding:8px 9px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit}.result:hover{background:var(--hover)}.result small{display:block;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composerwrap{padding:4px 16px 17px;background:linear-gradient(to top,var(--bg) 78%,transparent)}.composer{width:min(820px,100%);margin:auto}.box{background:var(--bg);border:1px solid #c9c9cf;border-radius:23px;padding:10px 12px 9px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.box:focus-within{border-color:#aaa}.input{width:100%;min-height:27px;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:3px 4px 9px;font-size:15px;line-height:1.45}.tools{display:flex;justify-content:space-between;align-items:center}.lefttools{display:flex;gap:2px}.tool{height:33px;min-width:33px;border-radius:9px;display:grid;place-items:center;color:#666}.tool:hover{background:var(--panel)}.send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#000;color:#fff}.send.stop{background:#000}.send:disabled{background:#d6d6d8;cursor:default}.hint{text-align:center;color:#8d8d91;font-size:10px;padding-top:7px}
.panel{width:340px;flex:0 0 340px;border-left:1px solid var(--line);background:var(--panel);padding:17px;overflow:auto}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.ptitle{font-size:14px;font-weight:650}.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.ctitle{font-size:13px;font-weight:650;margin-bottom:9px}.field{display:block;width:100%;padding:9px 10px;margin:6px 0;border:1px solid #d3d3d7;border-radius:8px;outline:0;background:var(--bg);color:var(--text)}.field:focus{border-color:#aaa}.save{width:100%;padding:9px;border-radius:8px;background:#111;color:white;font-weight:650}.terminal{background:#101010;color:#eee;border-radius:9px;padding:9px;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:220px;overflow:auto}.searchbox{display:flex;gap:6px}.searchbox .field{margin:0}.searchbtn{padding:9px 10px;border-radius:8px;background:#111;color:#fff}.searchlist{margin-top:8px}.panel-file{font-size:11px;padding:6px 0;border-bottom:1px solid var(--line);word-break:break-all}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;border-radius:9px;padding:9px 13px;font-size:12px;opacity:0;pointer-events:none;transition:.15s;z-index:100}.toast.show{opacity:1}.overlay{display:none}
@media(prefers-color-scheme:dark){:root{--bg:#212121;--panel:#171717;--text:#ececec;--muted:#a5a5a5;--line:#3d3d3d;--hover:#2b2b2b;--user:#2f2f2f}.avatar,.ai{background:#fff;color:#111}.me{background:#555;color:#eee}.box,.card,.suggest button,.download-card{background:#212121;border-color:#454545}.code{background:#181818;border-color:#3d3d3d}.codehead{background:#2b2b2b}.field{border-color:#454545}.save,.searchbtn{background:#fff;color:#111}.download-mini:hover{background:#404040}}
@media(max-width:1050px){.panel{display:none}.panel.open{display:block;position:fixed;top:0;right:0;bottom:0;z-index:40;box-shadow:-15px 0 35px rgba(0,0,0,.15)}}
@media(max-width:700px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.18s;box-shadow:12px 0 30px rgba(0,0,0,.14)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:25}.mobile{display:grid}.top{height:53px;padding:0 8px}.inner{width:calc(100% - 20px);gap:9px;padding:14px 0}.row.user .bubble{max-width:88%}.suggest{grid-template-columns:1fr}.welcome h1{font-size:25px}.composerwrap{padding:4px 8px 10px}.box{border-radius:20px}.panel.open{width:92%}}
</style>
</head>
<body>
<div class="app">
<div id="overlay" class="overlay" onclick="toggleSidebar(false)"></div>
<aside id="sidebar" class="sidebar">
  <div class="side-top"><div class="brand">Jolgue AI</div><button class="newchat" onclick="newChat()"><b>＋</b><span>New chat</span></button><div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg><input id="chatSearch" placeholder="Search chats" oninput="renderChats()"></div></div>
  <div class="scroll"><div class="label">Chats</div><div id="chats"></div><div class="label">Workspace</div><div id="files"></div></div>
  <div class="sidefoot"><div class="account"><div class="avatar">J</div><div class="accounttext"><div class="accountname">Jolgue AI</div><div class="accountsub">Workspace enabled</div></div><button class="icon" onclick="togglePanel(true)">⚙</button></div></div>
</aside>
<main class="main">
<header class="top"><div class="top-left"><button class="icon mobile" onclick="toggleSidebar(true)">☰</button><button class="model"><span id="modelName">Jolgue AI</span><span>⌄</span></button></div><div class="top-right"><span id="status" class="status">Ready</span><button class="icon" onclick="newChat()">＋</button><button class="icon" onclick="togglePanel(true)">⚙</button></div></header>
<div class="layout"><section class="chat-area"><div id="messages" class="messages"></div><div class="composerwrap"><div class="composer"><div class="box"><textarea id="input" class="input" rows="1" placeholder="Message Jolgue AI..."></textarea><div class="tools"><div class="lefttools"><button class="tool" onclick="togglePanel(true)" title="Tools">＋</button><button class="tool" onclick="showToast('Use the chat normally; tools are selected automatically.')" title="Tools">☷</button></div><button id="send" class="send" onclick="handleSend()" disabled title="Send"><svg id="sendIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg></button></div></div><div class="hint">Jolgue AI can make mistakes. Check important information.</div></div></div></section>
<aside id="panel" class="panel"><div class="panelhead"><div class="ptitle">Workspace & tools</div><button class="icon" onclick="togglePanel(false)">×</button></div>
<div class="card"><div class="ctitle">Provider</div><input id="base" class="field" placeholder="Base URL"><input id="model" class="field" placeholder="Model"><input id="key" class="field" type="password" placeholder="API key"><button class="save" onclick="saveProvider()">Save provider</button></div>
<div class="card"><div class="ctitle">Web search</div><div class="searchbox"><input id="webq" class="field" placeholder="Pesquisar na web..."><button class="searchbtn" onclick="manualSearch()">Search</button></div><div id="searchlist" class="searchlist"></div></div>
<div class="card"><div class="ctitle">Shell</div><input id="shellq" class="field" placeholder="python --version"><button class="searchbtn" style="width:100%" onclick="runShell()">Run command</button><pre id="shellout" class="terminal" style="display:none;margin-top:8px"></pre></div>
<div class="card"><div class="ctitle">Workspace files</div><div id="panelFiles"></div></div>
</aside></div></main></div><div id="toast" class="toast"></div>
<script>
const S={data:null,chat:null,busy:false,job:null,panel:false};
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch(_){}if(!r.ok&&r.status!==499)throw new Error(d.error||`HTTP ${r.status}`);return d}
function esc(s=''){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function md(s=''){let out='',last=0,m,re=/```([\w+-]*)\n?([\s\S]*?)```/g;while((m=re.exec(s))){out+=inline(esc(s.slice(last,m.index)));out+=`<div class="code"><div class="codehead"><span>${esc(m[1]||'code')}</span><button onclick="copyText(${JSON.stringify(m[2])})">Copy</button></div><pre>${esc(m[2])}</pre></div>`;last=m.index+m[0].length}out+=inline(esc(s.slice(last)));return out.replace(/\n/g,'<br>')}
function inline(s){return s.replace(/`([^`]+)`/g,'<span style="font-family:monospace;background:var(--hover);padding:2px 4px;border-radius:4px">$1</span>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function render(){renderChats();const box=document.getElementById('messages');if(!S.chat||!S.chat.messages?.length){box.innerHTML=`<div class="welcome"><div class="welcomein"><div class="logo">J</div><h1>What can I help you with?</h1><div class="suggest"><button onclick="useSuggestion('Cria um projeto Python completo no workspace.')"><b>Build a project</b><span>Create files, code and ZIP it</span></button><button onclick="useSuggestion('Pesquisa na web as novidades mais recentes de IA.')"><b>Research the web</b><span>Search current information</span></button><button onclick="useSuggestion('Executa um teste simples no shell e mostra o resultado.')"><b>Run a test</b><span>Use the workspace shell</span></button><button onclick="useSuggestion('Cria um ZIP com tudo o que está no workspace e prepara-o para download.')"><b>Make a ZIP</b><span>Get a downloadable archive</span></button></div></div></div>`;return}box.innerHTML=S.chat.messages.map((m,i)=>`<div class="row ${m.role}"><div class="inner"><div class="msgavatar ${m.role==='user'?'me':'ai'}">${m.role==='user'?'J':'AI'}</div><div class="copy"><div class="meta">${m.role==='user'?'You':'Jolgue AI'}</div><div class="bubble">${m.role==='assistant'?md(m.content):esc(m.content).replace(/\n/g,'<br>')}</div>${m.tools?.length?renderTools(m.tools):''}${m.role==='assistant'?`<div class="actions"><button onclick="copyText(${JSON.stringify(m.content||'')})">Copy</button><button onclick="regenerate(${i})">Regenerate</button></div>`:''}</div></div></div>`).join('');setTimeout(()=>{box.scrollTop=box.scrollHeight},0)}
function renderTools(tools){return tools.map(t=>{if(t.tool==='zip_files'&&t.download_url)return `<div class="tool-result">Created <b>${esc(t.path)}</b><br><a class="download-card" href="${esc(t.download_url)}">⇩ Download ZIP</a></div>`;if(t.tool==='web_search')return `<div class="tool-result"><b>Web search:</b> ${esc(t.query)}<div class="search-results">${(t.results||[]).map(r=>`<a class="result" href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.title)}</b><small>${esc(r.snippet||r.url)}</small></a>`).join('')}</div></div>`;return `<div class="tool-result"><b>${esc(t.tool||'tool')}</b>: ${esc(t.ok?'Done':(t.error||'Failed'))}${t.stdout?`<br><pre style="white-space:pre-wrap;margin:6px 0 0">${esc(t.stdout)}</pre>`:''}</div>`}).join('')}
function renderChats(){const q=(document.getElementById('chatSearch')?.value||'').toLowerCase();const cs=(S.data?.chats||[]).filter(c=>(c.title||'New chat').toLowerCase().includes(q));document.getElementById('chats').innerHTML=cs.map(c=>`<button class="chat ${S.chat?.id===c.id?'active':''}" onclick="pickChat('${c.id}')"><span class="chatname">${esc(c.title||'New chat')}</span><span class="chatdel" onclick="event.stopPropagation();deleteChat('${c.id}')">×</span></button>`).join('')||`<div class="file">No chats yet</div>`}
function renderFiles(files){const arr=files||[];const html=arr.map(f=>{const dl=f.path.toLowerCase().endsWith('.zip')?`<a class="download-mini" href="/download?path=${encodeURIComponent(f.path)}" onclick="event.stopPropagation()">⇩</a>`:'';return `<div class="file"><span class="file-name">${esc(f.path)}</span>${dl}</div>`}).join('')||'<div class="file">Workspace is empty</div>';document.getElementById('files').innerHTML=html;document.getElementById('panelFiles').innerHTML=arr.map(f=>{const dl=f.path.toLowerCase().endsWith('.zip')?`<a href="/download?path=${encodeURIComponent(f.path)}">Download</a>`:'';return `<div class="panel-file">${esc(f.path)} ${dl}</div>`}).join('')||'<div class="muted">No files</div>'}
async function load(){S.data=await api('/api/state');S.chat=S.data.chats?.[0]||null;document.getElementById('base').value=S.data.provider?.base_url||'';document.getElementById('model').value=S.data.provider?.model||'';document.getElementById('modelName').textContent=S.data.provider?.model||'Jolgue AI';render();refreshFiles()}
async function refreshFiles(){try{const r=await api('/api/files');renderFiles(r.files)}catch(e){}}
function pickChat(id){S.chat=S.data.chats.find(c=>c.id===id);render();toggleSidebar(false)}
async function newChat(){const c={id:crypto.randomUUID(),title:'New chat',messages:[]};S.data.chats.unshift(c);S.chat=c;await save();render()}
async function deleteChat(id){S.data.chats=S.data.chats.filter(c=>c.id!==id);if(S.chat?.id===id)S.chat=S.data.chats[0]||null;await save();render()}
async function save(){await api('/api/state','POST',S.data)}
function setBusy(v){S.busy=v;const b=document.getElementById('send');b.disabled=!v&&!document.getElementById('input').value.trim();b.classList.toggle('stop',v);b.title=v?'Stop':'Send';document.getElementById('sendIcon').innerHTML=v?'<rect x="7" y="7" width="10" height="10" rx="1"/>':'<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>';document.getElementById('status').textContent=v?'Thinking…':'Ready'}
async function handleSend(){if(S.busy){await stopChat();return}await send()}
async function send(){const input=document.getElementById('input'),text=input.value.trim();if(!text)return;if(!S.chat)await newChat();input.value='';resize();S.chat.messages.push({role:'user',content:text});if(S.chat.title==='New chat')S.chat.title=text.slice(0,42)||'Chat';render();const job=crypto.randomUUID();S.job=job;setBusy(true);try{const r=await api('/api/chat','POST',{messages:S.chat.messages,provider:S.data.provider,search:S.data.search,skills:S.data.skills,job_id:job});if(r.stopped){S.chat.messages.push({role:'assistant',content:'Generation stopped.'})}else{S.chat.messages.push({role:'assistant',content:r.content||r.error||'No response',tools:r.tools||[]})}await save();render();renderFiles(r.files||[])}catch(e){S.chat.messages.push({role:'assistant',content:'Error: '+e.message});await save();render()}finally{S.job=null;setBusy(false)}}
async function stopChat(){if(!S.job)return;try{await api('/api/chat/stop','POST',{job_id:S.job})}catch(e){}S.status='Stopped';}
async function regenerate(index){if(S.busy)return;while(S.chat.messages.length>index)S.chat.messages.pop();const last=S.chat.messages.findLast(m=>m.role==='user');if(last){document.getElementById('input').value=last.content;await send()}}
function useSuggestion(t){document.getElementById('input').value=t;resize();document.getElementById('input').focus();updateSend()}
function copyText(t){navigator.clipboard?.writeText(t);showToast('Copied')}
function updateSend(){document.getElementById('send').disabled=S.busy?!false:!document.getElementById('input').value.trim()}
function resize(){const x=document.getElementById('input');x.style.height='auto';x.style.height=Math.min(x.scrollHeight,190)+'px';updateSend()}
function saveProvider(){S.data.provider.base_url=document.getElementById('base').value.trim();S.data.provider.model=document.getElementById('model').value.trim();S.data.provider.api_key=document.getElementById('key').value.trim();document.getElementById('modelName').textContent=S.data.provider.model||'Jolgue AI';save();showToast('Provider saved')}
async function manualSearch(){const q=document.getElementById('webq').value.trim();if(!q)return;const box=document.getElementById('searchlist');box.innerHTML='Searching…';try{const r=await api('/api/search','POST',{search:{query:q,provider:S.data.search?.provider||'duckduckgo',api_key:S.data.search?.api_key||''}});box.innerHTML=(r.results||[]).map(x=>`<a class="result" target="_blank" rel="noopener" href="${esc(x.url)}"><b>${esc(x.title)}</b><small>${esc(x.snippet||x.url)}</small></a>`).join('')||'<div class="muted">No results</div>'}catch(e){box.innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}
async function runShell(){const q=document.getElementById('shellq').value.trim();if(!q)return;const out=document.getElementById('shellout');out.style.display='block';out.textContent='Running…';try{const r=await api('/api/shell','POST',{command:q});out.textContent=`$ ${r.command||q}\n\n${r.stdout||''}${r.stderr?'\n'+r.stderr:''}\n[exit ${r.exit_code}]`;refreshFiles()}catch(e){out.textContent='Error: '+e.message}}
function toggleSidebar(v){document.getElementById('sidebar').classList.toggle('open',!!v);document.getElementById('overlay').classList.toggle('show',!!v)}
function togglePanel(v){S.panel=v===undefined?!S.panel:v;document.getElementById('panel').classList.toggle('open',S.panel)}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),1800)}
document.getElementById('input').addEventListener('input',resize);document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});load();
</script></body></html>
